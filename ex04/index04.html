<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - User Registration Form</title>
</head>
<body>

    <main>
        <h1>User Registration Form</h1>

        <form action="#" method="post">
            
            <!-- Full Name -->
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required minlength="3">
            </p>

            <!-- Email -->
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required minlength="5">
            </p>

            <!-- Password -->
            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required minlength="8">
            </p>

            <!-- Radio Buttons (Group) -->
            <fieldset>
                <legend>Preferred Contact Method:</legend>

                <input type="radio" id="contact_email" name="contact_method" value="email" required>
                <label for="contact_email">Email</label><br>

                <input type="radio" id="contact_phone" name="contact_method" value="phone">
                <label for="contact_phone">Phone</label><br>

                <input type="radio" id="contact_none" name="contact_method" value="none">
                <label for="contact_none">No Preference</label>
            </fieldset>

            <br>

            <!-- Select Dropdown -->
            <p>
                <label for="experience">Experience Level:</label><br>
                <select id="experience" name="experience" required>
                    <option value="">-- Please choose an option --</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </p>

            <!-- Textarea -->
            <p>
                <label for="bio">Short Bio:</label><br>
                <textarea id="bio" name="bio" rows="4" cols="50" minlength="10" placeholder="Tell us a little about yourself..."></textarea>
            </p>

            <!-- Checkbox (Agreement) -->
            <p>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label>
            </p>

            <!-- Submit Button -->
            <p>
                <button type="submit">Register</button>
            </p>

        </form>
    </main>

</body>
</html>
