<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 02 - Links & Images</title>
</head>
<body>

    <header>
        <h1>My Profile Page</h1>
        <nav>
            <a href="#contact">Jump to Contact</a>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>About Me</h2>
            <img src="assets/profile.jpg" alt="Profile picture of Esraa Khammash" width="200">
            <p>Welcome to my profile! You can check out my projects and code repositories on GitHub.</p>
            <p>
                Visit my 
                <a href="https://github.com/Esraa11904" target="_blank" rel="noopener noreferrer">GitHub Profile</a>.
            </p>
        </section>

        <hr>

        <section id="contact">
            <h2>Contact Information</h2>
            <p>If you'd like to get in touch, feel free to send me an email:</p>
            <p>
                <a href="mailto:example@example.com">Send Email</a>
            </p>
        </section>
    </main>

</body>
</html>
